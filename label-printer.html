<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウッドベリーズ ラベル印刷</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --green: #16a34a;
  --green-hover: #15803d;
  --warm-bg: #faf9f6;
  --warm-white: #fffdf9;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-900: #111827;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
}

body {
  font-family: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic Pro", "Meiryo", sans-serif;
  background: var(--warm-bg);
  color: var(--gray-900);
  min-height: 100vh;
}

/* ── Header ── */
#app-header {
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
#app-header h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--gray-900);
  white-space: nowrap;
}
#search-wrap {
  position: relative;
  flex: 1;
  max-width: 320px;
  margin-left: auto;
}
#search-box {
  width: 100%;
  padding: 7px 32px 7px 12px;
  border: 1px solid var(--gray-300);
  border-radius: 6px;
  font-size: 14px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  background: var(--gray-50);
}
#search-box:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  background: #fff;
}
#search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: var(--gray-400);
  display: none;
  padding: 2px 6px;
  line-height: 1;
}
#search-clear:hover { color: var(--gray-700); }
#btn-new-label {
  padding: 7px 16px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s;
}
#btn-new-label:hover { background: #1d4ed8; }

/* ── Category Tabs ── */
#tab-bar {
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  padding: 8px 24px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
#tab-bar::-webkit-scrollbar { display: none; }
.tab-pill {
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 13px;
  border: 1.5px solid var(--gray-300);
  background: #fff;
  color: var(--gray-600);
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 5px;
  user-select: none;
}
.tab-pill:hover {
  border-color: var(--blue);
  color: var(--blue);
}
.tab-pill.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.tab-pill.active-warm {
  background: #f97316;
  border-color: #f97316;
  color: #fff;
}
.tab-badge {
  font-size: 11px;
  background: rgba(0,0,0,.08);
  border-radius: 10px;
  padding: 0 6px;
  line-height: 18px;
  min-width: 18px;
  text-align: center;
}
.tab-pill.active .tab-badge,
.tab-pill.active-warm .tab-badge {
  background: rgba(255,255,255,.25);
}

/* ── Main Grid Area ── */
#main-area {
  padding: 20px 24px;
  max-width: 1400px;
  margin: 0 auto;
}
#grid-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
#grid-header h2 { font-size: 16px; font-weight: 600; color: var(--gray-700); }
#label-count { font-size: 13px; color: var(--gray-500); }

#label-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
#no-results {
  display: none;
  text-align: center;
  padding: 80px 20px;
  color: var(--gray-500);
  font-size: 14px;
  width: 100%;
}

/* ── Label Buttons ── */
.label-btn {
  background: #fff;
  border-radius: 8px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  padding: 10px 8px;
  user-select: none;
  position: relative;
}
.label-btn:hover {
  transform: scale(1.03);
  box-shadow: var(--shadow-md);
}
.label-btn:active {
  transform: scale(0.98);
}
.label-btn-small {
  min-width: 120px;
  max-width: 180px;
  height: 80px;
  flex: 1 0 120px;
}
.label-btn-large {
  min-width: 160px;
  max-width: 220px;
  height: 100px;
  flex: 1 0 160px;
}
.label-btn .btn-main-text {
  font-size: 13px;
  line-height: 1.3;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  word-break: break-all;
  -webkit-text-stroke: 0.4px currentColor;
  paint-order: stroke fill;
}
.label-btn .btn-sub-text {
  font-size: 10px;
  opacity: .65;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* ── Context Menu ── */
#context-menu {
  display: none;
  position: fixed;
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  padding: 4px 0;
  min-width: 140px;
}
#context-menu .ctx-item {
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  color: var(--gray-700);
}
#context-menu .ctx-item:hover {
  background: var(--gray-100);
}
#context-menu .ctx-item.danger { color: #dc2626; }
#context-menu .ctx-item.danger:hover { background: #fef2f2; }

/* ── Modals ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(2px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #fff;
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}

/* ── Print Preview Modal ── */
#print-modal .modal-box { width: 540px; }
#print-modal h3 { font-size: 17px; margin-bottom: 16px; font-weight: 600; }
#print-preview-area {
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100px;
  margin-bottom: 16px;
  background: var(--gray-50);
}
#print-preview-area .preview-label {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.4;
  padding: 6px;
  -webkit-text-stroke: 0.4px currentColor;
  paint-order: stroke fill;
}
.print-note {
  background: #fffbeb;
  border: 1px solid #fcd34d;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  color: #92400e;
  margin-bottom: 16px;
  line-height: 1.6;
}
.form-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  font-size: 14px;
}
.form-row label {
  width: 100px;
  flex-shrink: 0;
  color: var(--gray-600);
  font-size: 13px;
}
.form-row select,
.form-row input[type=number] {
  padding: 6px 10px;
  border: 1px solid var(--gray-300);
  border-radius: 6px;
  font-size: 14px;
  outline: none;
}
.form-row select:focus,
.form-row input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(37,99,235,.1);
}
.form-row .hint { font-size: 11px; color: var(--gray-500); }

#text-select-area {
  margin-bottom: 14px;
  max-height: 300px;
  overflow-y: auto;
}
#text-select-area .ts-heading {
  font-size: 13px;
  color: var(--gray-700);
  font-weight: 600;
  margin-bottom: 8px;
}
#text-select-area .ts-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
  font-size: 13px;
  color: var(--gray-700);
  padding: 4px 0;
  border-bottom: 1px solid var(--gray-100);
}
#text-select-area .ts-item:last-child { border-bottom: none; }
#text-select-area input[type=number] {
  -moz-appearance: textfield;
}
#text-select-area input[type=number]::-webkit-inner-spin-button { opacity: 1; }
.pm-edit-text-btn:hover { background: var(--gray-100) !important; }

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--gray-200);
}
.btn {
  padding: 9px 22px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .15s;
}
.btn-print {
  background: var(--green);
  color: #fff;
  font-size: 15px;
  padding: 10px 32px;
}
.btn-print:hover { background: var(--green-hover); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: var(--gray-100); color: var(--gray-700); }
.btn-secondary:hover { background: var(--gray-200); }
.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover { background: #b91c1c; }

/* ── New/Edit Label Modal ── */
#edit-modal .modal-box { width: 560px; }
#edit-modal h3 { font-size: 17px; margin-bottom: 20px; font-weight: 600; }
.edit-field {
  margin-bottom: 14px;
}
.edit-field label {
  display: block;
  font-size: 13px;
  color: var(--gray-600);
  margin-bottom: 4px;
  font-weight: 500;
}
.edit-field .optional-tag {
  font-size: 11px;
  color: var(--gray-400);
  font-weight: 400;
  margin-left: 4px;
}
.edit-field input[type=text],
.edit-field select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--gray-300);
  border-radius: 6px;
  font-size: 14px;
  outline: none;
}
.edit-field input[type=text]:focus,
.edit-field select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(37,99,235,.1);
}
.edit-field .radio-group {
  display: flex;
  gap: 16px;
  padding-top: 4px;
}
.edit-field .radio-group label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  color: var(--gray-700);
  cursor: pointer;
}
#edit-preview-area {
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80px;
  margin-bottom: 14px;
  background: var(--gray-50);
}
.color-swatches {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.color-swatch {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.selected { border-color: var(--gray-900); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--gray-400); }
.color-custom-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 4px;
}
.color-custom-wrap input[type=color] {
  width: 28px;
  height: 28px;
  border: 1px solid var(--gray-300);
  border-radius: 50%;
  cursor: pointer;
  padding: 0;
  background: none;
}
.edit-field .checkbox-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--gray-700);
  cursor: pointer;
}

/* ── Print Sheet ── */
@page {
  size: A4 portrait;
  margin: 0;
}

#print-area { display: none; }

@media print {
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 210mm !important;
    height: 297mm !important;
    overflow: hidden !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    font-size: 0 !important;
  }
  /* Hide everything except print area */
  body > *:not(#print-area) {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
    overflow: hidden !important;
  }
  #print-area {
    display: block !important;
    visibility: visible !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 210mm !important;
    height: 297mm !important;
    margin: 0 !important;
    padding: 0 !important;
    transform: none !important;
    -webkit-transform: none !important;
    page-break-inside: avoid;
    overflow: visible !important;
  }
  #print-area * {
    visibility: visible !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}

.sheet-label {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  line-height: 1.25;
  -webkit-text-stroke: 0.4px currentColor;
  paint-order: stroke fill;
}

/* ── Mobile Responsive ── */
@media (max-width: 640px) {
  #app-header {
    flex-wrap: wrap;
    padding: 10px 12px;
    gap: 8px;
  }
  #app-header h1 {
    font-size: 15px;
    width: 100%;
    order: -1;
  }
  #search-wrap {
    flex: 1;
    max-width: none;
    margin-left: 0;
    min-width: 0;
  }
  #search-box {
    font-size: 16px; /* prevent iOS zoom on focus */
    padding: 9px 32px 9px 12px;
  }
  #btn-new-label {
    padding: 9px 14px;
    font-size: 13px;
    flex-shrink: 0;
  }
  #btn-settings {
    padding: 9px 12px !important;
  }
  #tab-bar {
    padding: 8px 12px;
    gap: 6px;
  }
  .tab-pill {
    padding: 7px 14px;
    font-size: 13px;
  }
  #main-area {
    padding: 12px;
  }
  #label-grid {
    gap: 8px;
  }
  .label-btn-small {
    min-width: 100px;
    max-width: 160px;
    height: 72px;
    flex: 1 0 100px;
  }
  .label-btn-large {
    min-width: 140px;
    max-width: 200px;
    height: 90px;
    flex: 1 0 140px;
  }
  .label-btn .btn-main-text {
    font-size: 12px;
  }

  /* Modals: full screen on mobile */
  .modal-overlay {
    align-items: flex-end;
  }
  .modal-box {
    width: 100% !important;
    max-width: 100% !important;
    max-height: 92vh;
    border-radius: 16px 16px 0 0;
    padding: 20px 16px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  .form-row {
    flex-wrap: wrap;
    gap: 8px;
  }
  .form-row label {
    width: auto;
    flex-shrink: 1;
  }
  .form-row select,
  .form-row input[type=number] {
    font-size: 16px; /* prevent iOS zoom */
    padding: 8px 10px;
  }
  .modal-actions {
    gap: 8px;
  }
  .btn {
    padding: 12px 20px;
    font-size: 15px;
  }
  .btn-print {
    flex: 1;
    padding: 14px 24px;
    font-size: 16px;
  }
  .btn-secondary {
    padding: 12px 16px;
  }

  /* Edit modal fields */
  .edit-field input[type=text],
  .edit-field input[type=password],
  .edit-field select {
    font-size: 16px; /* prevent iOS zoom */
    padding: 9px 10px;
  }

  /* Context menu */
  #context-menu {
    min-width: 160px;
  }
  #context-menu .ctx-item {
    padding: 12px 16px;
    font-size: 14px;
  }
}
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div id="app-header">
  <h1>ウッドベリーズ ラベル印刷</h1>
  <div id="search-wrap">
    <input type="text" id="search-box" placeholder="ラベルを検索...">
    <button id="search-clear" type="button">×</button>
  </div>
  <button id="btn-new-label">＋ 新規作成</button>
  <button id="btn-settings" style="padding:7px 10px;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:6px;cursor:pointer;font-size:16px;line-height:1" title="設定">⚙</button>
</div>

<!-- ═══ Category Tabs ═══ -->
<div id="tab-bar"></div>

<!-- ═══ Main Grid ═══ -->
<div id="main-area">
  <div id="grid-header">
    <h2 id="current-cat-name">人気・定番</h2>
    <span id="label-count"></span>
  </div>
  <div id="label-grid"></div>
  <div id="no-results">検索結果が見つかりませんでした</div>
</div>

<!-- ═══ Print Preview Modal ═══ -->
<div class="modal-overlay" id="print-modal">
  <div class="modal-box">
    <h3 id="pm-title"></h3>
    <div id="print-preview-area"></div>
    <div class="print-note">
      <strong>印刷方法:</strong><br>
      ① 「印刷する」をタップするとPDFが開きます<br>
      ② PDFを「実際のサイズ」で印刷してください<br>
      <span style="font-size:11px;color:#78350f">※「ページに合わせる」ではなく「実際のサイズ (100%)」を選択</span>
    </div>
    <div id="text-select-area"></div>
    <div class="form-row">
      <label>用紙タイプ:</label>
      <select id="pm-paper">
        <option value="small">95面 小ラベル (63295)</option>
        <option value="large">12面 大ラベル (28916)</option>
      </select>
    </div>
    <div id="single-count-row" class="form-row">
      <label>印刷枚数:</label>
      <input type="number" id="pm-count" min="1" value="95">
      <span class="hint" id="pm-count-hint"></span>
    </div>
    <div id="pm-total-info" style="display:none;font-size:13px;color:var(--gray-600);margin-bottom:12px;padding:8px 12px;background:var(--gray-50);border-radius:6px">
      合計: <strong id="pm-total-num">0</strong> 枚 / <span id="pm-total-max">95</span> 枚（残りは空欄）
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="pm-close">閉じる</button>
      <button class="btn btn-print" id="pm-print">PDF作成 → 印刷</button>
    </div>
    <div id="pdf-result" style="display:none;margin-top:16px;padding:16px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;text-align:center">
      <p style="font-size:14px;color:#166534;margin-bottom:12px;font-weight:600">✓ PDF作成完了</p>
      <a id="pdf-download-link" href="#" target="_blank" style="display:inline-block;padding:14px 32px;background:#16a34a;color:#fff;border-radius:8px;font-size:16px;font-weight:700;text-decoration:none">PDFを開いて印刷</a>
      <p style="font-size:12px;color:#4b5563;margin-top:10px">開いたPDFを「実際のサイズ (100%)」で印刷してください</p>
    </div>
  </div>
</div>

<!-- ═══ New/Edit Label Modal ═══ -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <h3 id="em-title">新しいシールを作成</h3>
    <div class="edit-field">
      <label>用紙</label>
      <div class="radio-group">
        <label><input type="radio" name="em-paper" value="small" checked> 95面 小ラベル</label>
        <label><input type="radio" name="em-paper" value="large"> 12面 大ラベル</label>
      </div>
    </div>
    <div class="edit-field">
      <label>果物名 / ラベル名</label>
      <input type="text" id="em-fruit" placeholder="例: バナナ">
    </div>
    <div class="edit-field">
      <label>農園名<span class="optional-tag">(任意)</span></label>
      <input type="text" id="em-farm" placeholder="例: やまさ農園">
    </div>
    <div class="edit-field">
      <label>地域<span class="optional-tag">(任意)</span></label>

// ━━━━━━━━━━ FRUIT AUTO COLOR ━━━━━━━━━━
function fruitAutoColor(text) {
  const t = text;
  // Berry/purple fruits
  if (/ブルーベリー|ハスカップ|カシス|アサイー|ミックスベリー/.test(t)) return 0x663399;
  // Red berries/strawberry
  if (/いちご|紅ほっぺ|ラズベリー|ストロベリー/.test(t)) return 0xCC0000;
  // Cherry
  if (/チェリー|さくらんぼ/.test(t)) return 0xCC0033;
  // Sakura/Pink/Peach
  if (/さくら|桃/.test(t)) return 0xCC3366;
  // Citrus and orange fruits
  if (/みかん|レモン|デコポン|いよかん|ゆず|柑橘|オレンジ|グレープフルーツ|ポンカン|きんかん|せとか|甘夏|甘平|南津海|はっさく|すだち|津の輝|清見|はれひめ|ひめこはる|ブラッド|クレメンティン|柿|マンゴー|パイン|パイナップル|にんじん|キャロット|かぼちゃ|パンプキン|さつまいも|ネクタリン|ゴールデンベリー/.test(t)) return 0xFF6600;
  // Grape/Purple
  if (/ぶどう|葡萄|巨峰|ナガノパープル|シャインマスカット|ブラックビート|クインニーナ|甲斐キング|BKシードレス|大峰|プラム|ソルダム|貴陽|皇寿|太陽|大石|レッドビュート|サマーエンジェル|クイーンローザ|プルーン/.test(t)) return 0x660066;
  // Green fruits
  if (/キウイ|メロン|ブラムリー|ミント|抹茶|バラード|ラフランス|洋梨|フェイジョア|すいか/.test(t)) return 0x339900;
  // Brown/Warm
  if (/カカオ|バニラ|生姜|しょうが|いちじく|あんず|梅|甘酒|味噌/.test(t)) return 0x996633;
  // Apple/Red fruits
  if (/りんご|ふじ|紅玉|ピンクレディ|シナノ|なかのきらめき|トマト|東京紅/.test(t)) return 0xCC0000;
  // Banana
  if (/バナナ/.test(t)) return 0xCC8800;
  // Dairy (yogurt, mascarpone, ricotta) - vivid blue
  if (/ヨーグルト|マスカルポーネ|リコッタ/.test(t)) return 0x0077CC;
  // Cream cheese - keep orange
  if (/クリームチーズ/.test(t)) return 0xFF6600;
  // Default
  return 0xFF6600;
}

function decToHex(n) {
  if (n === 0) return '#000000';
  return '#' + (n >>> 0).toString(16).padStart(6, '0');
}

function fontStack(f) {
  return '"コーポレートやわ明 Medium", "Yu Mincho", "YuMincho", serif';
}

function detectPaper(code) {
  return code === '28916' ? 'large' : 'small';
}

function labelName(path) {
  const parts = path.split('/');
  return parts[parts.length - 1];
}

function getCategory(lb) {
  // Custom labels have explicit category
  if (lb._category) return lb._category;
  const p = lb.path;
  const parts = p.split('/');
  if (parts[0] === 'point card') return 'ポイントカード';
  if (p.includes('住所') || p.includes('注意') || p.includes('ハーフバット')) return '住所・注意';
  if (parts[0] === 'ジャム') return 'ジャム';
  if (parts[0] === '季節もの') return '季節もの';
  if (parts[0] === '果物シール　大') {
    if (parts.length > 2) {
      if (parts[1] === '人気・定番') return '人気・定番';
      if (parts[1] === 'ぶどう') return 'ぶどう';
      if (parts[1] === 'りんご') return 'りんご';
      if (parts[1] === 'プラム系') return 'プラム';
      if (parts[1] === '柑橘') return '柑橘';
    }
    return 'その他果物';
  }
  // Fallbacks
  if (p.includes('サンド用')) return 'その他果物';
  return 'その他果物';
}

// Canvas-based text measurement for auto-fit
const _measureCanvas = document.createElement('canvas').getContext('2d');
function measureText(text, fontFamily, fontSizePt, bold) {
  const fontSizePx = fontSizePt * 1.333;
  _measureCanvas.font = (bold ? 'bold ' : '') + fontSizePx + 'px ' + fontFamily;
  const lines = text.split('\n');
  let maxW = 0;
  for (const line of lines) {
    const w = _measureCanvas.measureText(line).width;
    if (w > maxW) maxW = w;
  }
  const lineH = fontSizePx * 1.3;
  return { width: maxW, height: lines.length * lineH };
}

// mm to px (approx 96dpi)
function mmToPx(mm) { return mm * 3.7795; }

function autoFitFontSize(text, labelWmm, labelHmm, fontFamily, bold, basePt, minPt) {
  const padMm = 1;
  const maxWpx = mmToPx(labelWmm - padMm * 2);
  const maxHpx = mmToPx(labelHmm - padMm * 2);
  let sz = basePt;
  while (sz > minPt) {
    const m = measureText(text, fontFamily, sz, bold);
    if (m.width <= maxWpx && m.height <= maxHpx) break;
    sz -= 0.5;
  }
  return Math.max(sz, minPt);
}

// ── GitHub Sync ──
let githubFileSha = null;

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || '';
}

async function fetchSharedData() {
  try {
    // Try raw.githubusercontent.com first (fast, no auth, cached up to 5min)
    const url = 'https://raw.githubusercontent.com/' + GITHUB_REPO + '/master/' + GITHUB_FILE + '?t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    // Also fetch SHA for future updates
    fetchFileSha();
    return data;
  } catch(e) {
    console.warn('Failed to fetch shared data:', e);
    return null;
  }
}

async function fetchFileSha() {
  try {
    const token = getToken();
    const headers = token ? { 'Authorization': 'token ' + token } : {};
    const res = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + GITHUB_FILE, { headers });
    if (res.ok) {
      const data = await res.json();
      githubFileSha = data.sha;
    }
  } catch(e) {}
}

async function pushSharedData(data) {
  const token = getToken();
  if (!token) {
    alert('データを共有するにはGitHub Tokenが必要です。\n右上の ⚙ ボタンから設定してください。');
    return false;
  }
  try {
    // Get latest SHA
    const shaRes = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + GITHUB_FILE, {
      headers: { 'Authorization': 'token ' + token }
    });
    if (shaRes.ok) {
      const shaData = await shaRes.json();
      githubFileSha = shaData.sha;
    }

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = {
      message: 'ラベルデータ更新',
      content: content,
      sha: githubFileSha
    };
    const res = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + GITHUB_FILE, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      const result = await res.json();
      githubFileSha = result.content.sha;
      return true;
    } else {
      const err = await res.json();
      console.error('GitHub push failed:', err);
      alert('保存に失敗しました: ' + (err.message || res.status));
      return false;
    }
  } catch(e) {
    console.error('Push error:', e);
    alert('保存に失敗しました: ' + e.message);
    return false;
  }
}

function getSharedPayload() {
  const custom = allLabels.filter(lb => lb._custom);
  const overrides = {};
  allLabels.forEach((lb, i) => {
    if (lb._overridden) {
      const orig = LABELS[i];
      if (orig) {
        const ov = {};
        for (const k of ['texts','font','size','color','border','borderColor','bold','_category','image']) {
          if (JSON.stringify(lb[k]) !== JSON.stringify(orig[k])) ov[k] = lb[k];
        }
        if (Object.keys(ov).length) overrides[i] = ov;
      }
    }
  });
  return { customLabels: custom, overrides: overrides };
}

function loadData() {
  allLabels = LABELS.map(lb => Object.assign({}, lb, { _builtin: true }));

  // Load from localStorage as cache first
  try {
    const overrides = JSON.parse(localStorage.getItem(OVERRIDE_KEY) || '{}');
    for (const [idx, ov] of Object.entries(overrides)) {
      const i = parseInt(idx);
      if (i >= 0 && i < allLabels.length) {
        Object.assign(allLabels[i], ov, { _builtin: true, _overridden: true });
      }
    }
  } catch(e) {}
  try {
    const custom = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    for (const lb of custom) {
      lb._custom = true;
      allLabels.push(lb);
    }
  } catch(e) {}
}

function applySharedData(data) {
  if (!data) return;
  // Rebuild from LABELS + shared data
  allLabels = LABELS.map(lb => Object.assign({}, lb, { _builtin: true }));
  // Apply overrides
  if (data.overrides) {
    for (const [idx, ov] of Object.entries(data.overrides)) {
      const i = parseInt(idx);
      if (i >= 0 && i < allLabels.length) {
        Object.assign(allLabels[i], ov, { _builtin: true, _overridden: true });
      }
    }
  }
  // Apply custom labels
  if (data.customLabels) {
    for (const lb of data.customLabels) {
      lb._custom = true;
      allLabels.push(lb);
    }
  }
  // Update localStorage cache
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data.customLabels || []));
  localStorage.setItem(OVERRIDE_KEY, JSON.stringify(data.overrides || {}));
  // Re-apply auto colors
  allLabels.forEach(lb => {
    if (lb.texts.length > 0 && !lb._custom && !lb._overridden) {
      const fc = fruitAutoColor(lb.texts.join(' '));
      lb.color = fc;
      if (lb.border) lb.borderColor = fc;
    }
  });
  renderTabs();
  renderGrid();
}

async function saveCustomLabels() {
  const custom = allLabels.filter(lb => lb._custom);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(custom));
  await pushSharedData(getSharedPayload());
}

async function saveOverrides() {
  const overrides = {};
  allLabels.forEach((lb, i) => {
    if (lb._overridden) {
      const orig = LABELS[i];
      if (orig) {
        const ov = {};
        for (const k of ['texts','font','size','color','border','borderColor','bold','_category','image']) {
          if (JSON.stringify(lb[k]) !== JSON.stringify(orig[k])) ov[k] = lb[k];
        }
        if (Object.keys(ov).length) overrides[i] = ov;
      }
    }
  });
  localStorage.setItem(OVERRIDE_KEY, JSON.stringify(overrides));
  await pushSharedData(getSharedPayload());
}

// ━━━━━━━━━━ CATEGORY TABS ━━━━━━━━━━
function countForCat(catId) {
  if (catId === 'すべて') return allLabels.length;
  return allLabels.filter(lb => getCategory(lb) === catId).length;
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const pill = document.createElement('div');
    pill.className = 'tab-pill';
    const count = countForCat(cat.id);
    if (activeTab === cat.id) {
      pill.classList.add(cat.warm ? 'active-warm' : 'active');
    }
    pill.innerHTML = cat.label + ' <span class="tab-badge">' + count + '</span>';
    pill.addEventListener('click', () => {
      activeTab = cat.id;
      searchQuery = '';
      document.getElementById('search-box').value = '';
      document.getElementById('search-clear').style.display = 'none';
      renderTabs();
      renderGrid();
    });
    bar.appendChild(pill);
  });
}

// ━━━━━━━━━━ LABEL GRID ━━━━━━━━━━
function getFilteredLabels() {
  let list = allLabels;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(lb => {
      const name = lb.path.toLowerCase();
      const texts = lb.texts.join(' ').toLowerCase();
      return name.includes(q) || texts.includes(q);
    });
  } else if (activeTab !== 'すべて') {
    list = list.filter(lb => getCategory(lb) === activeTab);
  }
  // Sort alphabetically by label name
  list.sort((a, b) => labelName(a.path).localeCompare(labelName(b.path), 'ja'));
  return list;
}

function renderGrid() {
  const filtered = getFilteredLabels();
  const grid = document.getElementById('label-grid');
  const noRes = document.getElementById('no-results');
  const catName = document.getElementById('current-cat-name');
  const countEl = document.getElementById('label-count');

  if (searchQuery) {
    catName.textContent = '検索結果: "' + searchQuery + '"';
  } else {
    catName.textContent = activeTab;
  }
  countEl.textContent = filtered.length + ' 件';

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';
  grid.innerHTML = '';

  filtered.forEach(lb => {
    const isLarge = detectPaper(lb.code) === 'large';
    const btn = document.createElement('div');
    btn.className = 'label-btn ' + (isLarge ? 'label-btn-large' : 'label-btn-small');

    const textColor = decToHex(lb.color);
    const borderColor = lb.border ? decToHex(lb.borderColor) : '#e0e0e0';

    btn.style.border = '1.5px solid ' + borderColor;
    btn.style.color = textColor;

    const firstText = lb.texts[0] || '';
    const lines = firstText.split('\n');

    // For multi-line: show last line as main, rest as sub
    let mainText, subText = '';
    if (lines.length >= 2) {
      // First line(s) = farm/region info, last line(s) = fruit name
      subText = lines.slice(0, -1).join(' ');
      mainText = lines[lines.length - 1];
    } else {
      mainText = lines[0];
    }

    let html = '';
    if (lb.image) {
      html += '<img src="' + lb.image + '" style="max-width:90%;max-height:' + (isLarge ? '60' : '45') + 'px;object-fit:contain;border-radius:3px">';
      if (mainText) html += '<div class="btn-sub-text" style="margin-top:2px">' + mainText + '</div>';
    } else {
      html = '<div class="btn-main-text">' + mainText + '</div>';
      if (subText) {
        html += '<div class="btn-sub-text">' + subText + '</div>';
      }
    }
    btn.innerHTML = html;

    // Click: open print modal
    btn.addEventListener('click', (e) => {
      if (e.button === 2) return; // right click handled separately
      openPrintModal(lb);
    });

    // Right-click: context menu
    btn.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, lb);
    });

    // Long-press for touch
    btn.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'touch') return;
      longPressTimer = setTimeout(() => {
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, lb);
      }, 600);
    });
    btn.addEventListener('pointerup', () => clearTimeout(longPressTimer));
    btn.addEventListener('pointercancel', () => clearTimeout(longPressTimer));
    btn.addEventListener('pointermove', () => clearTimeout(longPressTimer));

    grid.appendChild(btn);
  });
}

// ━━━━━━━━━━ CONTEXT MENU ━━━━━━━━━━
function showContextMenu(x, y, lb) {
  contextTarget = lb;

  delBtn.style.display = lb._custom ? 'block' : 'none';

  menu.style.left = Math.min(x, window.innerWidth - mw) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - mh) + 'px';
}

function hideContextMenu() {
  document.getElementById('context-menu').style.display = 'none';
  contextTarget = null;
}

// ━━━━━━━━━━ PRINT PREVIEW MODAL ━━━━━━━━━━
function openPrintModal(lb) {
  currentPrintLabel = lb;
  const modal = document.getElementById('print-modal');
  document.getElementById('pm-title').textContent = labelName(lb.path);

  // Paper
  const paperType = detectPaper(lb.code);
  document.getElementById('pm-paper').value = paperType;

  // Default count = fill sheet
  const paper = PAPERS[paperType];
  document.getElementById('pm-count').value = paper.total;
  document.getElementById('pm-count').max = paper.total;
  document.getElementById('pm-count-hint').textContent = '最大 ' + paper.total + ' 枚/シート';

  // Preview
  renderPrintPreview(lb, lb.texts[0], paperType);

  // Text selection / quantity allocation
  const tsa = document.getElementById('text-select-area');
  const singleRow = document.getElementById('single-count-row');
  const totalInfo = document.getElementById('pm-total-info');
  textQuantities = [];

  if (lb.texts.length <= 1) {
    tsa.innerHTML = '';
    singleRow.style.display = 'flex';
    totalInfo.style.display = 'none';
    selectedTexts = [true];
  } else {
    // Multi-text: show quantity inputs for each text
    singleRow.style.display = 'none';
    totalInfo.style.display = 'block';
    document.getElementById('pm-total-max').textContent = paper.total;
    const perText = Math.floor(paper.total / lb.texts.length);
    let html = '<div class="ts-heading">種類ごとの枚数を指定:</div>';
    lb.texts.forEach((t, i) => {
      const displayT = t.replace(/\n/g, ' / ');
      textQuantities[i] = perText;
      html += '<div class="ts-item" style="margin-bottom:6px;gap:10px">' +
        '<input type="number" min="0" max="' + paper.total + '" value="' + perText + '" data-tidx="' + i + '" ' +
        'style="width:56px;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;text-align:center">' +
        '<span style="flex:1">' + displayT + '</span>' +
        '<button type="button" class="pm-edit-text-btn" data-tidx="' + i + '" ' +
        'style="font-size:11px;padding:2px 8px;border:1px solid #d1d5db;border-radius:4px;background:#fff;cursor:pointer;color:#4b5563">編集</button>' +
        '</div>';
    });
    tsa.innerHTML = html;
    updateTotalInfo();

    // Quantity input handlers
    tsa.querySelectorAll('input[type=number]').forEach(inp => {
      inp.addEventListener('input', () => {
        textQuantities[parseInt(inp.dataset.tidx)] = parseInt(inp.value) || 0;
        updateTotalInfo();
      });
    });

    // Text edit handlers (for price changes etc.)
    tsa.querySelectorAll('.pm-edit-text-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.tidx);
        const current = lb.texts[idx];
        const newVal = prompt('テキストを編集（改行は \\n で入力）:', current.replace(/\n/g, '\\n'));
        if (newVal !== null) {
          lb.texts[idx] = newVal.replace(/\\n/g, '\n');
          // Update display
          const span = btn.parentElement.querySelector('span');
          span.textContent = lb.texts[idx].replace(/\n/g, ' / ');
          renderPrintPreview(lb, lb.texts[idx], document.getElementById('pm-paper').value);
          // Save override if built-in label
          saveOverrides();
        }
      });
    });

    selectedTexts = lb.texts.map(() => true);
  }

  modal.classList.add('open');
}

function renderPrintPreview(lb, text, paperType) {
  const paper = PAPERS[paperType || detectPaper(lb.code)];
  const scale = paperType === 'large' || detectPaper(lb.code) === 'large' ? 2.5 : 3.5;
  const w = paper.labelW * scale;
  const h = paper.labelH * scale;
  const textColor = decToHex(lb.color);
  const borderColor = decToHex(lb.borderColor);
  const borderStyle = '';
  const fontFamily = fontStack(lb.font);
  const fontSize = (lb.size || 10) * (scale * 0.28);
  const displayText = (text || '').replace(/\n/g, '<br>');

  let content = '';
  if (lb.image) {
    content = '<img src="' + lb.image + '" style="max-width:' + (w - 8) + 'px;max-height:' + (h - 8) + 'px;object-fit:contain">';
    if (displayText && displayText !== '(プレビュー)') {
      content += '<div style="font-size:' + (fontSize * 0.7) + 'px;margin-top:4px">' + displayText + '</div>';
    }
  } else {
    content = displayText;
  }

  document.getElementById('print-preview-area').innerHTML =
    '<div class="preview-label" style="width:' + w + 'px;height:' + h + 'px;' +
    'border-radius:' + (paper.radius * scale) + 'px;' + borderStyle +
    'color:' + textColor + ';font-family:' + fontFamily + ';font-size:' + fontSize + 'px;' +
    (lb.bold ? 'font-weight:bold;' : '') + 'flex-direction:column;">' + content + '</div>';
}

function closePrintModal() {
  document.getElementById('print-modal').classList.remove('open');
  document.getElementById('pdf-result').style.display = 'none';
  document.getElementById('pm-print').disabled = false;
  document.getElementById('pm-print').textContent = 'PDF作成 → 印刷';
  // Revoke old blob URL
  const link = document.getElementById('pdf-download-link');
  if (link._blobUrl) { URL.revokeObjectURL(link._blobUrl); link._blobUrl = null; }

  const pt = document.getElementById('pm-paper').value;

// ━━━━━━━━━━ HELPERS ━━━━━━━━━━
let textQuantities = [];

function updateTotalInfo() {
  const total = textQuantities.reduce((a, b) => a + b, 0);
  const el = document.getElementById('pm-total-num');
  if (el) {
    el.textContent = total;

// ━━━━━━━━━━ PRINT (PDF Generation) ━━━━━━━━━━
// mm to PDF points (1mm = 72/25.4 pt)
function mmToPt(mm) { return mm * 72 / 25.4; }

// Canvas for PDF text measurement
const _pdfMeasureCanvas = document.createElement('canvas').getContext('2d');

function pdfMeasureText(text, fontSizePt, bold) {
  const px = fontSizePt * 1.333;
  _pdfMeasureCanvas.font = (bold ? 'bold ' : '') + px + 'px "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif';
  const lines = text.split('\n');
  let maxW = 0;
  for (const line of lines) {
    const w = _pdfMeasureCanvas.measureText(line).width;
    if (w > maxW) maxW = w;
  }
  return { width: maxW, height: lines.length * px * 1.3 };
}

function doPrint() {
  if (!currentPrintLabel) return;
  const lb = currentPrintLabel;
  const paperType = document.getElementById('pm-paper').value;
  const paper = PAPERS[paperType];

  // Build the list of texts to print with their quantities
  let printQueue = [];
  if (lb.texts.length > 1 && textQuantities.length > 0) {
    lb.texts.forEach((t, i) => {
      const qty = textQuantities[i] || 0;
      for (let j = 0; j < qty; j++) printQueue.push(t);
    });
    if (printQueue.length === 0) {
      alert('枚数を1つ以上指定してください');
      return;
    }
    if (printQueue.length > paper.total) {
      alert('合計が' + paper.total + '枚を超えています（現在' + printQueue.length + '枚）');
      return;
    }
  } else {
    const numCopies = Math.min(parseInt(document.getElementById('pm-count').value) || paper.total, paper.total);
    const text = lb.texts[0] || '';
    for (let j = 0; j < numCopies; j++) printQueue.push(text);
  }

  // Show loading state
  const printBtn = document.getElementById('pm-print');
  printBtn.disabled = true;
  printBtn.textContent = 'PDF作成中...';
  document.getElementById('pdf-result').style.display = 'none';

  // Use setTimeout to let UI update before heavy canvas work
  setTimeout(() => { generatePDF(lb, paper, printQueue); }, 50);
}

function generatePDF(lb, paper, printQueue) {
  try {
  // ── Generate PDF using Canvas ──
  const DPI = 3;  // scale factor for sharp rendering
  const A4W = 210, A4H = 297; // mm
  const canvasW = Math.round(mmToPx(A4W) * DPI);
  const canvasH = Math.round(mmToPx(A4H) * DPI);

  const canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  const ctx = canvas.getContext('2d');

  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);

  const textColor = decToHex(lb.color);
  const fFamily = '"Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS PMincho", serif';

  let placed = 0;
  for (let row = 0; row < paper.rows && placed < printQueue.length; row++) {
    for (let col = 0; col < paper.cols && placed < printQueue.length; col++) {
      const text = printQueue[placed];
      const leftMm = paper.marginLeft + col * (paper.labelW + paper.gapH);
      const topMm = paper.marginTop + row * (paper.labelH + paper.gapV);

      // Convert to canvas pixels
      const x = mmToPx(leftMm) * DPI;
      const y = mmToPx(topMm) * DPI;
      const w = mmToPx(paper.labelW) * DPI;
      const h = mmToPx(paper.labelH) * DPI;

      // Auto-fit font size
      const fittedSize = autoFitFontSize(text, paper.labelW, paper.labelH, fFamily, lb.bold, paper.baseFontPt, paper.minFontPt);
      const origSize = lb.size || paper.baseFontPt;
      const origMeasure = measureText(text, fFamily, origSize, lb.bold);
      const maxWpx = mmToPx(paper.labelW - 2);
      const maxHpx = mmToPx(paper.labelH - 2);
      const useSize = (origMeasure.width <= maxWpx && origMeasure.height <= maxHpx) ? origSize : fittedSize;

      const fontSizePx = useSize * 1.333 * DPI;
      ctx.font = (lb.bold ? 'bold ' : '') + fontSizePx + 'px ' + fFamily;
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Draw text with stroke for bolder appearance
      ctx.strokeStyle = textColor;
      ctx.lineWidth = 0.4 * DPI;
      ctx.lineJoin = 'round';

      const lines = text.split('\n');
      const lineH = fontSizePx * 1.3;
      const totalH = lines.length * lineH;
      const startY = y + (h - totalH) / 2 + lineH / 2;
      const centerX = x + w / 2;

      for (let li = 0; li < lines.length; li++) {
        const ly = startY + li * lineH;
        ctx.strokeText(lines[li], centerX, ly);
        ctx.fillText(lines[li], centerX, ly);
      }

      placed++;
    }
  }

  // Convert canvas to PDF
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const imgData = canvas.toDataURL('image/png');
  pdf.addImage(imgData, 'PNG', 0, 0, A4W, A4H, undefined, 'FAST');

  // Show download link in modal
  const blob = pdf.output('blob');
  const blobUrl = URL.createObjectURL(blob);
  const link = document.getElementById('pdf-download-link');
  // Revoke old URL
  if (link._blobUrl) URL.revokeObjectURL(link._blobUrl);
  link.href = blobUrl;
  link._blobUrl = blobUrl;
  document.getElementById('pdf-result').style.display = 'block';
  document.getElementById('pm-print').textContent = '✓ 作成完了';

  // Scroll to the download link
  document.getElementById('pdf-result').scrollIntoView({ behavior: 'smooth' });

  } catch(e) {
    alert('PDF作成に失敗しました: ' + e.message);
    document.getElementById('pm-print').disabled = false;
    document.getElementById('pm-print').textContent = 'PDF作成 → 印刷';
  }
}

// ━━━━━━━━━━ NEW / EDIT LABEL MODAL ━━━━━━━━━━
let editColor = '#FF9900';
let editCustomColor = '#FF9900';
let editImageData = null;

function openEditModal(lb, lbIndex) {
  editingLabelIndex = lbIndex; // -1 for new
  const modal = document.getElementById('edit-modal');
  const title = document.getElementById('em-title');
  const saveBtn = document.getElementById('em-save');
  const actionsDiv = document.getElementById('em-actions');

  // Remove old delete button if exists
  const oldDel = document.getElementById('em-delete');
  if (oldDel) oldDel.remove();

  if (lbIndex >= 0 && lb) {
    title.textContent = 'シールを編集';
    saveBtn.textContent = '保存する';
    // Populate fields
    const firstText = lb.texts[0] || '';
    const lines = firstText.split('\n');
    if (lines.length >= 2) {
      // Try to parse region + farm from first line
      const topLine = lines[0];
      const parts = topLine.split(/[\s　]+/);
      document.getElementById('em-region').value = parts[0] || '';
      document.getElementById('em-farm').value = parts.slice(1).join(' ') || '';
      document.getElementById('em-fruit').value = lines.slice(1).join('\n') || '';
    } else {
      document.getElementById('em-fruit').value = firstText;
      document.getElementById('em-farm').value = '';
      document.getElementById('em-region').value = '';
    }
    const pt = detectPaper(lb.code);
    document.querySelectorAll('input[name="em-paper"]').forEach(r => r.checked = r.value === pt);
    editColor = decToHex(lb.color);
    document.getElementById('em-border').checked = lb.border;
    // Category
    const cat = getCategory(lb);
    document.getElementById('em-category').value = cat;

    // Image
    if (lb.image) {
      editImageData = lb.image;
      document.getElementById('em-img-name').textContent = '(既存の画像)';
      document.getElementById('em-img-clear').style.display = 'inline';
      document.getElementById('em-img-preview').style.display = 'block';
      document.getElementById('em-img-thumb').src = lb.image;
    } else {
      editImageData = null;
      document.getElementById('em-img-file').value = '';
      document.getElementById('em-img-name').textContent = '';
      document.getElementById('em-img-clear').style.display = 'none';
      document.getElementById('em-img-preview').style.display = 'none';
    }

    // Delete button for custom labels
    if (lb._custom) {
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger';
      delBtn.id = 'em-delete';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', () => {
        if (confirm('このラベルを削除しますか？')) {
          allLabels.splice(allLabels.indexOf(lb), 1);
          saveCustomLabels();
          closeEditModal();
          renderTabs();
          renderGrid();
        }
      });
      actionsDiv.insertBefore(delBtn, actionsDiv.firstChild);
    }
  } else {
    title.textContent = '新しいシールを作成';
    saveBtn.textContent = '登録する';
    document.getElementById('em-fruit').value = '';
    document.getElementById('em-farm').value = '';
    document.getElementById('em-region').value = '';
    document.querySelectorAll('input[name="em-paper"]').forEach(r => r.checked = r.value === 'small');
    editColor = '#FF9900';
    document.getElementById('em-border').checked = true;
    document.getElementById('em-category').value = 'その他果物';
    editImageData = null;
    document.getElementById('em-img-file').value = '';
    document.getElementById('em-img-name').textContent = '';
    document.getElementById('em-img-clear').style.display = 'none';
    document.getElementById('em-img-preview').style.display = 'none';
  }

  renderColorSwatches();
  updateEditPreview();
  modal.classList.add('open');
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingLabelIndex = -1;
}

function renderColorSwatches() {
  const container = document.getElementById('em-colors');
  container.innerHTML = '';
  COLOR_PRESETS.forEach(c => {
    const div = document.createElement('div');
    div.className = 'color-swatch' + (editColor === c ? ' selected' : '');
    div.style.background = c;
    div.addEventListener('click', () => {
      editColor = c;
      renderColorSwatches();
      updateEditPreview();
    });
    container.appendChild(div);
  });
  // Custom color
  const wrap = document.createElement('div');
  wrap.className = 'color-custom-wrap';
  const inp = document.createElement('input');
  inp.type = 'color';
  inp.value = editCustomColor;
  const isCustom = !COLOR_PRESETS.includes(editColor);
  if (isCustom) {
    inp.value = editColor;
    editCustomColor = editColor;
  }
  inp.addEventListener('input', () => {
    editCustomColor = inp.value;
    editColor = inp.value;
    renderColorSwatches();
    updateEditPreview();
  });
  wrap.appendChild(inp);
  container.appendChild(wrap);
}

function buildLabelText() {
  const fruit = document.getElementById('em-fruit').value.trim();
  const farm = document.getElementById('em-farm').value.trim();
  const region = document.getElementById('em-region').value.trim();
  if (!fruit) return '';
  if (region || farm) {
    const topParts = [region, farm].filter(Boolean).join(' ');
    return topParts + '\n' + fruit;
  }
  return fruit;
}

function updateEditPreview() {
  const text = buildLabelText() || '(プレビュー)';
  const hasBorder = document.getElementById('em-border').checked;
  const paperType = document.querySelector('input[name="em-paper"]:checked').value;
  const paper = PAPERS[paperType];
  const scale = paperType === 'large' ? 2.5 : 3.5;
  const w = paper.labelW * scale;
  const h = paper.labelH * scale;
  const displayText = text.replace(/\n/g, '<br>');
  const borderStyle = hasBorder ? 'border:2px solid ' + editColor + ';' : 'border:1px solid #e0e0e0;';

  let previewContent = '';
  if (editImageData) {
    previewContent = '<img src="' + editImageData + '" style="max-width:' + (w - 8) + 'px;max-height:' + (h - 8) + 'px;object-fit:contain">';
    if (displayText && displayText !== '(プレビュー)') {
      previewContent += '<div style="font-size:' + (11 * scale * 0.28 * 0.7) + 'px;margin-top:3px">' + displayText + '</div>';
    }
  } else {
    previewContent = displayText;
  }

  document.getElementById('edit-preview-label').outerHTML =
    '<div id="edit-preview-label" style="width:' + w + 'px;height:' + h + 'px;display:flex;align-items:center;' +
    'justify-content:center;text-align:center;border-radius:' + (paper.radius * scale) + 'px;' +
    borderStyle + 'color:' + editColor + ';font-size:' + (11 * scale * 0.28) + 'px;line-height:1.4;' +
    'font-family:' + fontStack('コーポレートやわ明 Medium') + ';flex-direction:column;">' + previewContent + '</div>';
}

function hexToDecColor(hex) {
  if (!hex || hex === '#000000') return 0;
  return parseInt(hex.replace('#', ''), 16);
}

function saveLabel() {
  const fruit = document.getElementById('em-fruit').value.trim();
  if (!fruit) {
    alert('果物名を入力してください');
    return;
  }

  const text = buildLabelText();
  const paperType = document.querySelector('input[name="em-paper"]:checked').value;
  const code = paperType === 'large' ? '28916' : '63295';
  const hasBorder = document.getElementById('em-border').checked;
  const category = document.getElementById('em-category').value;
  const colorDec = hexToDecColor(editColor);

  if (editingLabelIndex >= 0) {
    // Edit existing
    const lb = allLabels[editingLabelIndex];
    lb.texts = [text];
    lb.code = code;
    lb.color = colorDec;
    lb.border = hasBorder;
    lb.borderColor = hasBorder ? colorDec : 0;
    lb._category = category;
    if (editImageData) {
      lb.image = editImageData;
    } else {
      delete lb.image;
    }

    if (lb._custom) {
      saveCustomLabels();
    } else {
      lb._overridden = true;
      saveOverrides();
    }
  } else {
    // New label
    const farm = document.getElementById('em-farm').value.trim();
    const region = document.getElementById('em-region').value.trim();
    const pathParts = [category, fruit];
    if (farm) pathParts.splice(1, 0, farm);
    const autoColor = fruitAutoColor(text);
    const finalColor = colorDec || autoColor;
    const newLabel = {
      path: pathParts.join('/'),
      code: code,
      texts: [text],
      font: 'コーポレートやわ明 Medium',
      size: 11.3,
      color: finalColor,
      border: hasBorder,
      borderColor: hasBorder ? finalColor : 0,
      bold: false,
      _custom: true,
      _category: category
    };
    if (editImageData) {
      newLabel.image = editImageData;
    }
    allLabels.push(newLabel);
    saveCustomLabels();
  }

  closeEditModal();
  renderTabs();
  renderGrid();
}

// ━━━━━━━━━━ POPULATE CATEGORY DROPDOWN ━━━━━━━━━━
function populateCategoryDropdown() {
  const sel = document.getElementById('em-category');
  sel.innerHTML = '';
  CATEGORIES.filter(c => c.id !== 'すべて').forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.label;
    sel.appendChild(opt);
  });
}

// ━━━━━━━━━━ EVENT LISTENERS ━━━━━━━━━━
document.getElementById('search-box').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  renderGrid();
});

document.getElementById('search-clear').addEventListener('click', () => {
  searchQuery = '';
  document.getElementById('search-box').value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderGrid();
});

document.getElementById('btn-new-label').addEventListener('click', () => {
  openEditModal(null, -1);
});

// Print modal
document.getElementById('pm-paper').addEventListener('change', updatePrintPaperHint);
document.getElementById('pm-close').addEventListener('click', closePrintModal);
document.getElementById('pm-print').addEventListener('click', doPrint);
document.getElementById('print-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('print-modal')) closePrintModal();
});

// Edit modal
document.getElementById('em-cancel').addEventListener('click', closeEditModal);
document.getElementById('em-save').addEventListener('click', saveLabel);
document.getElementById('edit-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('edit-modal')) closeEditModal();
});

// Live preview updates
['em-fruit', 'em-farm', 'em-region'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateEditPreview);
});
document.getElementById('em-border').addEventListener('change', updateEditPreview);
document.querySelectorAll('input[name="em-paper"]').forEach(r => {
  r.addEventListener('change', updateEditPreview);
});

// Image upload
document.getElementById('em-img-btn').addEventListener('click', () => {
  document.getElementById('em-img-file').click();
});
document.getElementById('em-img-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    editImageData = ev.target.result;
    document.getElementById('em-img-name').textContent = file.name;
    document.getElementById('em-img-clear').style.display = 'inline';
    document.getElementById('em-img-preview').style.display = 'block';
    document.getElementById('em-img-thumb').src = editImageData;
    updateEditPreview();
  };
  reader.readAsDataURL(file);
});
document.getElementById('em-img-clear').addEventListener('click', () => {
  editImageData = null;
  document.getElementById('em-img-file').value = '';
  document.getElementById('em-img-name').textContent = '';
  document.getElementById('em-img-clear').style.display = 'none';
  document.getElementById('em-img-preview').style.display = 'none';
  updateEditPreview();
});

// Context menu
document.getElementById('ctx-edit').addEventListener('click', () => {
  if (contextTarget) {
    const idx = allLabels.indexOf(contextTarget);
    openEditModal(contextTarget, idx);
  }
  hideContextMenu();
});
document.getElementById('ctx-delete').addEventListener('click', () => {
  if (contextTarget && contextTarget._custom) {
    if (confirm('このラベルを削除しますか？')) {
      const idx = allLabels.indexOf(contextTarget);
      if (idx >= 0) allLabels.splice(idx, 1);
      saveCustomLabels();
      renderTabs();
      renderGrid();
    }
  }
  hideContextMenu();
});

document.addEventListener('click', (e) => {
  if (!document.getElementById('context-menu').contains(e.target)) {
    hideContextMenu();
  }
});

// Settings modal
document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('set-token').value = getToken();
  const status = document.getElementById('sync-status');
  status.textContent = getToken() ? '✓ トークン設定済み（データ共有が有効）' : 'トークン未設定（閲覧のみ）';
  status.style.color = getToken() ? 'var(--green)' : 'var(--gray-500)';
  document.getElementById('settings-modal').classList.add('open');
});
document.getElementById('set-close').addEventListener('click', () => {
  document.getElementById('settings-modal').classList.remove('open');
});
document.getElementById('set-save').addEventListener('click', () => {
  const token = document.getElementById('set-token').value.trim();
  if (token) {
    localStorage.setItem(TOKEN_KEY, token);
  } else {
    localStorage.removeItem(TOKEN_KEY);
  }
  document.getElementById('settings-modal').classList.remove('open');
  // Sync after saving token
  if (token) {
    fetchSharedData().then(data => { if (data) applySharedData(data); });
  }
});
document.getElementById('settings-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('settings-modal')) {
    document.getElementById('settings-modal').classList.remove('open');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closePrintModal();
    closeEditModal();
    hideContextMenu();
    document.getElementById('settings-modal').classList.remove('open');
  }
});

// ━━━━━━━━━━ INIT ━━━━━━━━━━
loadData();
populateCategoryDropdown();
renderTabs();
renderGrid();

// Load shared data from GitHub (async, updates UI when ready)
fetchSharedData().then(data => {
  if (data && (data.customLabels.length > 0 || Object.keys(data.overrides).length > 0)) {
    applySharedData(data);
  }
});
</script>
</body>
</html>
